[package]
name = "objectstore-shim"
version = "0.2.0"
description = "C FFI shim for objectstore-mojo: libobjectstoremojo.so over libcurl, dlopened at runtime. ABI 2: pooled connections, additive over ABI 1."

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.host-dependencies]
libcurl = ">=8,<9"
