name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # The unit tests run in the stable / ubuntu-latest job below.
      task: ""

  test:
    needs: release
    if: ${{ !cancelled() }}
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        env: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["stable"]' || '["default", "stable"]') }}
    steps:
      - uses: actions/checkout@v4

      # MinIO is no longer fetched here. It is a `minio-server` dependency in
      # pixi.toml, so setup-pixi installs it and `minio` is on PATH — which is
      # already what tests/run_tests.sh looks for. See the comment on that
      # dependency for why the download had to go.

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: the committed lock file is written by 0.78.0, and an
          # unpinned pixi rejects it as not up-to-date with the workspace.
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}

      - name: Unit tests and CLI build
        run: pixi run -e ${{ matrix.env }} check

      # Through `pixi run`, with $CONDA_PREFIX set, and then from the plain
      # shell, where the shim is found through the binary's rpath.
      - name: CLI smoke
        run: |
          pixi run -e ${{ matrix.env }} ./build/objectstore-mojo version
          pixi run -e ${{ matrix.env }} ./build/objectstore-mojo stat file://$PWD/LICENSE
          pixi run -e ${{ matrix.env }} ./build/objectstore-mojo head file://$PWD/NOTICE 40
          pixi run -e ${{ matrix.env }} ./build/objectstore-mojo ls file://$PWD/shim
          env -u CONDA_PREFIX ./build/objectstore-mojo version
          env -u CONDA_PREFIX ./build/objectstore-mojo stat file://$PWD/LICENSE

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() }}
    needs: [release, release-check, test]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
