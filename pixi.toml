[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "objectstore.mojo"
version = "0.3.0"
description = "Storage and HTTP layer for magmalake: FileIO over local files, HTTP(S) range reads and S3 (SigV4, vended credentials, presigned URLs)."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
# libcurl brings TLS + a CA bundle; the C shim (shim/) wraps it in a
# non-variadic surface and installs lib/libobjectstoremojo.so into the env.
libcurl = ">=8,<9"
objectstore-shim = { path = "shim" }
# The HTTP tests run against a throwaway `python -m http.server`; the S3
# tests run against MinIO or moto. Both are driven by tests/run_tests.sh.
python = ">=3.10,<3.14"
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "2a12807b7847984aff2c8bf148b0eb7515a99844" }

[tasks]
# Builds the test binary, spawns the local HTTP server (and MinIO/moto when
# available), runs everything, tears the servers down. See tests/run_tests.sh.
test = { cmd = "bash tests/run_tests.sh" }
# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
#
# Not folded into `check` (below): CI's single "Unit tests and CLI build"
# step already runs `check` as one unit, so adding lint there would make the
# dedicated CI lint step re-run it on every matrix leg. `check` here already
# omits other CI-relevant tasks (format-check, the CLI smoke test) for the
# same reason — it is a local-dev bundle, not a mirror of everything CI runs.
lint = { cmd = "mojolint --lsp -I src -I tests src tests bench" }
# Tests plus a CLI build, so a broken CLI fails CI too.
check = { depends-on = ["test", "cli"] }
cli = { cmd = "mkdir -p build && mojo build src/main.mojo -I src -o build/objectstore-mojo" }
bench = { cmd = "bash bench/run_bench.sh" }
fmt = { cmd = "mojo format src tests bench" }
# `mojo format` has no check mode in 1.0.0 — it rejects `--check`, and there is
# none among the hidden options either — so the check is: format, then assert the
# tree did not move. It rewrites the files as a side effect, which is what CI
# wants and is harmless locally; run it with your own work committed or stashed.
format-check = { cmd = "mojo format src tests bench && git diff --exit-code -- src tests bench" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is objectstore-mojo; the Mojo import stays
# `from objectstore import …`.
[package]
name = "objectstore-mojo"
version = "0.3.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/objectstore"
name = "objectstore"

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"
objectstore-shim = { path = "shim" }

# ── stable / nightly toolchain matrix (see CI) ──────────────────────────────
[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

[environments]
default = ["nightly"]
stable = ["stable"]
